version: '3.8'

services:
  # ============================================================================
  # 1. API & Inference Gateway (FastAPI)
  # ============================================================================
  fastapi-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aisd_fastapi_app
    ports:
      - "8000:8000"
    environment:
      - POSTGRES_USER=aisd_user
      - POSTGRES_PASSWORD=aisd_password
      - POSTGRES_DB=aisd_warehouse
      - POSTGRES_HOST=postgres-db
      - POSTGRES_PORT=5432
      - REDIS_HOST=redis-cache
      - REDIS_PORT=6379
      - KAFKA_BOOTSTRAP_SERVERS=kafka-broker:9092
    volumes:
      - ./app:/app
    depends_on:
      postgres-db:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
      kafka-broker:
        condition: service_started
    networks:
      - aisd-network

  # ============================================================================
  # 2. Relational Warehouse & Vector Store (PostgreSQL + pgvector)
  # ============================================================================
  postgres-db:
    image: pgvector/pgvector:pg16
    container_name: aisd_postgres_db
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=aisd_user
      - POSTGRES_PASSWORD=aisd_password
      - POSTGRES_DB=aisd_warehouse
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init_warehouse.sql:/docker-entrypoint-initdb.d/init_warehouse.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aisd_user -d aisd_warehouse"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - aisd-network

  # ============================================================================
  # 3. Online Feature Store & Low-Latency Cache (Redis)
  # ============================================================================
  redis-cache:
    image: redis:7-alpine
    container_name: aisd_redis_cache
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - aisd-network

  # ============================================================================
  # 4. Streaming Event Ingestion Message Broker (Apache Kafka & Zookeeper)
  # ============================================================================
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: aisd_zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - aisd-network

  kafka-broker:
    image: confluentinc/cp-kafka:7.5.0
    container_name: aisd_kafka_broker
    ports:
      - "9092:9092"
      - "29092:29092"
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-broker:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    networks:
      - aisd-network

  # ============================================================================
  # 5. Operational Metrics & Latency Observability (Prometheus)
  # ============================================================================
  prometheus:
    image: prom/prometheus:v2.47.0
    container_name: aisd_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - aisd-network

networks:
  aisd-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
